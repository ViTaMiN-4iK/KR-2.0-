name: CI / Quality Checks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install QA tools
        run: pip install ruff bandit

      - name: Detect changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "files=$(git diff --name-only HEAD~1 | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Run Ruff linter on changed files
        run: |
          echo "Changed files: ${{ steps.changed.outputs.files }}"
          ruff check ${{ steps.changed.outputs.files }}

      - name: Run Bandit (SAST) on changed source files
        run: bandit -r ${{ steps.changed.outputs.files }} --exclude tests/ -f txt || true

      - name: Run pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing
