services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ueba-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ueba-net

  api:
    build: .
    container_name: ueba-api
    command: ["python", "-m", "data.docker_entrypoint"]
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FLASK_SECRET_KEY=dev-secret-key-change-in-production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data:rw
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ueba-net

  web:
    build: .
    container_name: ueba-web
    command: python -m flask --app web.app:app run --host 0.0.0.0 --port 5000
    environment:
      - FLASK_APP=web/app.py
      - FLASK_ENV=production
      - API_BASE_URL=http://api:8000
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FLASK_SECRET_KEY=dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      - api
    networks:
      - ueba-net

volumes:
  es_data:

networks:
  ueba-net:
    driver: bridge
